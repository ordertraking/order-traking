<!DOCTYPE html>
<html>
<head>
<title>Track Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family:Arial;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.box{
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
width:350px;
text-align:center;
}
input{
width:100%;
padding:12px;
margin:10px 0;
}
button{
width:100%;
padding:12px;
background:#0b3d91;
color:#fff;
border:none;
border-radius:6px;
}
#result{
margin-top:20px;
}
</style>
</head>

<body>

<div class="box">
<h2>Track Your Order</h2>

<input type="text" id="orderNo" placeholder="Enter Order Number">

<button>Track Order</button>

<div id="result"></div>

</div>

</body>
</html>
