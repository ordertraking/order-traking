<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking System</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #3b82f6; color: white; } /* Blue header like your image */
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Order Tracking System</h2>

    <table>
        <thead>
            <tr>
                <th>Order No</th>
                <th>Customer Name</th>
                <th>Item</th>
                <th>Size</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Paid</th>
                <th>Payment Status</th>
                <th>Order Status</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="order-data">
            <!-- Sample Data Row -->
            <tr>
                <td>1001</td>
                <td>Ali Khan</td>
                <td>T-Shirt</td>
                <td>Medium</td>
                <td>2</td>
                <td>3000</td>
                <td>3000</td>
                <td>Paid</td>
                <td>Shipped</td>
                <td>2026-08-29</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
