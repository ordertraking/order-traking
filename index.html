<style>
/* ================= GLOBAL VARIABLES & RESET ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root {
    --bg-color: #030713;
    --text-color: #fff;
    --gold: #f4c33e;
    --blue: #087dff;
    --lightblue: #54aaff;
    --muted: #a8b2c5;
    --line: rgba(255,255,255,.13);
    --nav-bg: rgba(3,7,19,.92);
    --card-bg: rgba(11,21,41,.72);
    --about-grad: linear-gradient(110deg, rgba(10,21,43,.82), rgba(5,12,27,.55));
    --stat-bg: rgba(255,255,255,.025);
    --freelance-bg: rgba(5,12,27,.96);
    --field-bg: #081126;
}

[data-theme="light"] {
    --bg-color: #f8fafc;
    --text-color: #0f172a;
    --gold: #b8860b;
    --blue: #2563eb;
    --lightblue: #1d4ed8;
    --muted: #64748b;
    --line: rgba(0,0,0,.13);
    --nav-bg: rgba(255,255,255,.92);
    --card-bg: rgba(255,255,255,0.9);
    --about-grad: linear-gradient(110deg, rgba(241,245,249,0.9), rgba(226,232,240,0.8));
    --stat-bg: rgba(0,0,0,0.025);
    --freelance-bg: rgba(255,255,255,0.96);
    --field-bg: #ffffff;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter', sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    overflow-x:hidden;
    transition: background 0.3s ease, color 0.3s ease;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

/* ================= NAVBAR ================= */

.nav{
    position:fixed;
    z-index:100;
    top:0;
    left:0;
    right:0;
    height:96px;
    background: var(--nav-bg);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
}

.nav-inner{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.brand-logo{
    font-family:'Poppins', sans-serif;
    font-size:38px;
    font-weight: 700;
    color:var(--gold);
}

.brand-name strong{
    font-size:20px;
    font-weight: 600;
}

.brand-name strong span{
    color:var(--gold);
}

.brand-name small{
    display:block;
    color:var(--muted);
    font-size:10px;
    letter-spacing:2px;
    margin-top:5px;
}

.nav-links{
    display:flex;
    gap:32px;
}

.nav-links a{
    color:var(--text-color);
    font-size:15px;
    font-weight: 500;
    padding:38px 0;
    position:relative;
    opacity: 0.8;
}

.nav-links a:hover,
.nav-links a.active{
    color:var(--gold);
    opacity: 1;
}

.nav-links a.active:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:25px;
    height:2px;
    background:var(--gold);
}

.nav-right-actions {
    display: flex;
    align-items: center;
    gap: 15px;
}

.theme-toggle-btn {
    background: var(--card-bg);
    border: 1px solid var(--line);
    color: var(--gold);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

.theme-toggle-btn:hover {
    transform: scale(1.05);
}

.phone{
    border:1px solid var(--gold);
    color:var(--gold);
    padding:13px 20px;
    border-radius:10px;
    font-weight:600;
    transition: 0.3s;
}
.phone:hover {
    background: var(--gold);
    color: var(--bg-color);
}

.menu{
    display:none;
    border:0;
    background:none;
    color:var(--text-color);
    font-size:28px;
    cursor: pointer;
}

/* ================= HERO SECTION (Original & Integrated) ================= */

.hero{
    min-height:100vh;
    padding-top:110px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 80% 45%,
        rgba(0,105,255,.20),
        transparent 30%
    ),
    radial-gradient(
        circle at 10% 85%,
        rgba(0,120,255,.08),
        transparent 30%
    );
}

.hero:before{
    content:"";
    position:absolute;
    width:650px;
    height:650px;
    right:-220px;
    top:120px;
    border-radius:50%;
    border:1px solid rgba(0,125,255,.15);
}

.hero-grid{
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    align-items:center;
    gap:35px;
    position: relative;
    z-index: 2;
}

.hello{
    color:var(--gold);
    font-size:13px;
    font-weight:700;
    letter-spacing:4px;
    margin-bottom:18px;
}

.hello:after{
    content:"";
    display:inline-block;
    width:70px;
    height:2px;
    background:var(--gold);
    margin-left:15px;
    vertical-align:middle;
}

h1{
    font-family:'Poppins', sans-serif;
    font-size:clamp(42px, 5.5vw, 70px);
    line-height:1.1;
    letter-spacing:-1px;
    font-weight: 700;
}

h1 .first { display: block; color: #f7f9ff; }
h1 .last { display: block; color: var(--gold); }

.title{
    margin-top:20px;
    font-size:18px;
    font-weight: 600;
    letter-spacing:1px;
}
.title span{ color:var(--blue); }

.hero-text{
    max-width:580px;
    margin-top:18px;
    color:var(--muted);
    font-size:15px;
    line-height:1.8;
    font-weight: 400;
}

.hero-buttons{
    display:flex;
    gap:15px;
    margin-top:28px;
    flex-wrap:wrap;
}

.btn-hero{
    display:inline-block;
    padding:15px 26px;
    border-radius:10px;
    border:1px solid var(--line);
    font-weight:600;
    transition:.3s;
}
.btn-hero:hover{ transform:translateY(-4px); }
.btn-hero.gold{ color:var(--gold); border-color:var(--gold); }
.btn-hero.gold:hover { background: var(--gold); color: var(--bg-color); }
.btn-hero.blue{
    color:#fff;
    border:0;
    background:linear-gradient(100deg,#087dff,#4b36ff);
    box-shadow:0 12px 35px rgba(0,90,255,.25);
}

.social-hero{
    display:flex;
    gap:13px;
    margin-top:27px;
}
.social-hero a{
    width:43px;
    height:43px;
    display:grid;
    place-items:center;
    border:1px solid var(--line);
    border-radius:50%;
    color:var(--muted);
    font-weight:600;
}
.social-hero a:hover{ color:var(--gold); border-color:var(--gold); }

/* ================= PROFILE VISUALS (From your code, cleaned) ================= */

.hero-visual{
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height:540px;
}

.profile-area{
    position: relative;
    width:370px;
    height:370px;
    margin: 0 auto;
}

.profile-area::before {
    content: "";
    position: absolute;
    inset: -40px;
    border-radius: 50%;
    background: radial-gradient( circle, rgba(25,112,255,.22), transparent 65% );
    filter: blur(15px);
}

.ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18);
}

.ring.gold {
    inset: -13px;
    border: 2px solid var(--gold);
    border-left-color: transparent;
    animation: rotate 10s linear infinite;
}

.ring.blue {
    inset: 10px;
    border: 2px solid rgba(35,123,255,.8);
    border-right-color: transparent;
    animation: rotateReverse 8s linear infinite;
}

@keyframes rotate { to { transform: rotate(360deg); } }
@keyframes rotateReverse { to { transform: rotate(-360deg); } }

.profile-img-container {
    position: absolute;
    inset: 24px;
    border-radius: 50%;
    overflow: hidden;
    background: #f3f5f9;
    border: 5px solid rgba(255,255,255,.95);
    box-shadow: 0 0 50px rgba(25,113,255,.22), 0 25px 80px rgba(0,0,0,.45);
}

.profile-img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
}

/* ================= FLOATING CARDS & STATUS ================= */

.floating-card {
    position: absolute;
    padding: 13px 17px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;

    backdrop-filter: blur(16px);
