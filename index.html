<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Ibrahim | Graphic & Web Designer</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #030816;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(3, 8, 22, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .logo {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #f5c542;
        }

        .nav-btn {
            padding: 10px 20px;
            border: 1px solid #f5c542;
            color: #f5c542;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: #f5c542;
            color: #030816;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 8% 60px;
            gap: 50px;
        }

        .hero-content {
            flex: 1;
        }

        .hero-content h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(40px, 5vw, 65px);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero-content h1 span {
            color: #f5c542;
        }

        .hero-content p {
            color: #aebbd0;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .hero-visual {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .profile-box {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 4px solid #f5c542;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(245, 197, 66, 0.2);
            background: #111;
        }

        .profile-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 850px) {
            .hero {
                flex-direction: column-reverse;
                text-align: center;
                padding-top: 140px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">Muhammad Ibrahim</div>
        <a href="https://wa.me/923209306672" target="_blank" class="nav-btn">
            <i class="fa-brands fa-whatsapp"></i> +92 320 9306672
        </a>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Hello, I'm <br><span>Muhammad Ibrahim</span></h1>
            <p>Professional Graphic Designer & Web Developer creating modern, unique, and stunning digital experiences that help your brand stand out.</p>
            <a href="https://wa.me/923209306672" class="nav-btn" style="background:#f5c542; color:#030816;">Contact On WhatsApp</a>
        </div>
        <div class="hero-visual">
            <div class="profile-box">
                <img src="profile.jpg" alt="Muhammad Ibrahim">
            </div>
        </div>
    </section>

</body>
</html>
