<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markaz Fabric</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
background:#f5f5f5;
}

header{
background:#0b3d91;
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.hero{
padding:40px 20px;
text-align:center;
}

.hero h1{
font-size:34px;
color:#222;
}

.hero p{
margin-top:10px;
color:#666;
font-size:18px;
}

.btn{
display:inline-block;
margin-top:25px;
padding:14px 28px;
background:#0b3d91;
color:white;
text-decoration:none;
border-radius:8px;
font-size:18px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h3{
margin-bottom:10px;
}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}
</style>
</head>

<body>

<header>
MARKAZ FABRIC
</header>

<section class="hero">
<h1>Welcome to Markaz Fabric</h1>
<p>Printing • Designing • Order Tracking</p>

<a class="btn" href="#">Track Your Order</a>

</section>

<section class="cards">

<div class="card">
<h3>🎨 Designing</h3>
<p>Professional Design Services</p>
</div>

<div class="card">
<h3>🖨 Printing</h3>
<p>High Quality Printing</p>
</div>

<div class="card">
<h3>📦 Order Tracking</h3>
<p>Track Your Order Anytime</p>
</div>

<div class="card">
<h3>📞 Contact</h3>
<p>WhatsApp Support</p>
</div>

</section>

<footer>

© 2026 Markaz Fabric

</footer>

</body>
</html>
