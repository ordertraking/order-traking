<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUHAMMAD IBRAHIM | Graphic & Web Designer</title>
<!-- Google Fonts: Poppins for professional modern look -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    scroll-padding-top: 100px; /* Fixes section header overlapping behind fixed navbar */
}

:root {
    --bg-color: #030713;
    --text-color: #fff;
    --gold: #f4c33e;
    --blue: #087dff;
    --lightblue: #54aaff;
    --muted: #a8b2c5;
    --line: rgba(255,255,255,.13);
    --nav-bg: rgba(3,7,19,.92);
    --card-bg: rgba(11,21,41,.72);
    --about-grad: linear-gradient(110deg, rgba(10,21,43,.82), rgba(5,12,27,.55));
    --stat-bg: rgba(255,255,255,.025);
    --freelance-bg: rgba(5,12,27,.96);
    --field-bg: #081126;
}

[data-theme="light"] {
    --bg-color: #f8fafc;
    --text-color: #0f172a;
    --gold: #b8860b;
    --blue: #2563eb;
    --lightblue: #1d4ed8;
    --muted: #64748b;
    --line: rgba(0,0,0,.13);
    --nav-bg: rgba(255,255,255,.92);
    --card-bg: rgba(255,255,255,0.9);
    --about-grad: linear-gradient(110deg, rgba(241,245,249,0.9), rgba(226,232,240,0.8));
    --stat-bg: rgba(0,0,0,0.025);
    --freelance-bg: rgba(255,255,255,0.96);
    --field-bg: #ffffff;
}

body{
    font-family:'Poppins', sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    overflow-x:hidden;
    transition: background 0.3s ease, color 0.3s ease;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

/* ================= NAVBAR ================= */

.nav{
    position:fixed;
    z-index:100;
    top:0;
    left:0;
    right:0;
    height:96px;
    background: var(--nav-bg);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
}

.nav-inner{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.brand-logo{
    font-family:'Poppins', sans-serif;
    font-size:38px;
    font-weight: 700;
    color:var(--gold);
}

.brand-name strong{
    font-size:20px;
    font-weight: 600;
}

.brand-name strong span{
    color:var(--gold);
}

.brand-name small{
    display:block;
    color:var(--muted);
    font-size:10px;
    letter-spacing:2px;
    margin-top:5px;
}

.nav-links{
    display:flex;
    gap:32px;
}

.nav-links a{
    color:var(--text-color);
    font-size:15px;
    font-weight: 500;
    padding:38px 0;
    position:relative;
    opacity: 0.8;
}

.nav-links a:hover,
.nav-links a.active{
    color:var(--gold);
    opacity: 1;
}

.nav-links a.active:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:25px;
    height:2px;
    background:var(--gold);
}

.nav-right-actions {
    display: flex;
    align-items: center;
    gap: 15px;
}

.theme-toggle-btn {
    background: var(--card-bg);
    border: 1px solid var(--line);
    color: var(--gold);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

.theme-toggle-btn:hover {
    transform: scale(1.05);
}

.phone{
    border:1px solid var(--gold);
    color:var(--gold);
    padding:13px 20px;
    border-radius:10px;
    font-weight:600;
}

.menu{
    display:none;
    border:0;
    background:none;
    color:var(--text-color);
    font-size:28px;
    cursor: pointer;
}

/* ================= HERO ================= */

.hero{
    min-height:100vh;
    padding-top:110px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 80% 45%,
        rgba(0,105,255,.20),
        transparent 30%
    ),
    radial-gradient(
        circle at 10% 85%,
        rgba(0,120,255,.08),
        transparent 30%
    );
}

.hero:before{
    content:"";
    position:absolute;
    width:650px;
    height:650px;
    right:-220px;
    top:120px;
    border-radius:50%;
    border:1px solid rgba(0,125,255,.15);
}

.hero-grid{
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    align-items:center;
    gap:35px;
}

.hello{
    color:var(--gold);
    font-size:13px;
    font-weight:700;
    letter-spacing:4px;
    margin-bottom:18px;
}

.hello:after{
    content:"";
    display:inline-block;
    width:70px;
    height:2px;
    background:var(--gold);
    margin-left:15px;
    vertical-align:middle;
}

h1{
    /* FIXED MOBILE FONT SIZE */
    font-size: clamp(36px, 10vw, 70px);
    line-height:1.1;
    letter-spacing:-1px;
    font-weight: 700;
}

h1 span{
    color:var(--gold);
}

.title{
    margin-top:20px;
    font-size:18px;
    font-weight: 600;
    letter-spacing:1px;
}

.title span{
    color:var(--blue);
}

.hero-text{
    max-width:580px;
    margin-top:18px;
    color:var(--muted);
    font-size:15px;
    line-height:1.8;
    font-weight: 400;
}

.actions{
    display:flex;
    gap:15px;
    margin-top:28px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    border-radius:10px;
    border:1px solid var(--line);
    font-weight:600;
    transition:.3s;
    font-size: 14px;
}

.btn:hover{
    transform:translateY(-3px);
}

.btn.gold{
    color:var(--gold);
    border-color:var(--gold);
}

.btn.blue{
    color:#fff;
    border:0;
    background:linear-gradient(100deg,#087dff,#4b36ff);
    box-shadow:0 10px 30px rgba(0,90,255,.3);
}

.social{
    display:flex;
    gap:12px;
    margin-top:28px;
}

.social a{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border:1px solid var(--line);
    border-radius:50%;
    color:var(--muted);
    font-size:15px;
    transition: 0.3s;
}

.social a:hover{
    color:var(--gold);
    border-color:var(--gold);
    transform: translateY(-3px);
}

/* ================= PROFILE ================= */

.profile-wrap{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:540px;
    width: 100%;
}

.profile-ring{
    position:relative;
    width:370px;
    height:370px;
    overflow:hidden;
    border-radius:50%;
    border:3px solid var(--gold);
    background: radial-gradient(circle, rgba(0,105,255,.22), rgba(0,0,0,0) 68%);
    box-shadow: 0 0 50px rgba(0,95,255,.25), inset 0 0 30px rgba(244,195,62,.10);
    padding: 12px;
    margin: 0 auto;
}

.profile-ring:before{
    content:"";
    position:absolute;
    inset:12px;
    border:1px solid rgba(0,135,255,.8);
    border-radius:50%;
    z-index:2;
    pointer-events:none;
}

.profile{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    border-radius:50%;
}

.freelance{
    position:absolute;
    z-index:5;
    bottom:20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 11px 20px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--freelance-bg);
    border: 1px solid var(--line);
    border-radius: 50px;
    box-shadow: 0 15px 35px rgba(0,0,0,.3);
}

.freelance span{
    color: var(--text-color);
    font-size: 13px;
    font-weight: 500;
}

.freelance b{
    color: var(--gold);
    font-weight: 600;
}

.dot{
    display:inline-block;
    width:8px;
    height:8px;
    background:#1fe38a;
    border-radius:50%;
    box-shadow: 0 0 8px #1fe38a;
}

/* ================= SECTIONS ================= */

section{
    padding:105px 0;
}

.section-label{
    color:var(--gold);
    font-size:13px;
    letter-spacing:3px;
    font-weight:700;
}

.section-title{
    margin-top:8px;
    font-size:38px;
    font-weight: 700;
}

.section-title span{
    color:var(--blue);
}

.section-desc{
    margin-top:10px;
    color:var(--muted);
    max-width:650px;
    line-height:1.7;
}

/* ================= ABOUT ================= */

.about-box{
    margin-top:40px;
    padding:38px;
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:40px;
    border:1px solid var(--line);
    border-radius:20px;
    background: var(--about-grad);
}

.about-box h3{
    font-size:28px;
    font-weight: 700;
}

.about-box p{
    color:var(--muted);
    line-height:1.8;
    margin:16px 0 22px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.stat{
    text-align:center;
    padding:23px 10px;
    border:1px solid var(--line);
    border-radius:13px;
    background: var(--stat-bg);
}

.stat strong{
    display:block;
    font-size:28px;
    color:var(--text-color);
    font-weight:
