<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Tracking</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:350px;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,.2);
text-align:center;
}

h2{
margin-bottom:20px;
color:#0066cc;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:#0066cc;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#004d99;
}

#result{
margin-top:20px;
text-align:left;
}
</style>

</head>
<body>

<div class="container">

<h2>Order Tracking</h2>

<input type="text" id="orderNo" placeholder="Enter Order Number">

<button onclick="trackOrder()">
Track Order
</button>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
<div class="header">
    <img src="logo.png" alt="Amazon Printing Logo" class="logo">

    <h1>Amazon Printing Pvt. Ltd.</h1>
    <p>Order Tracking System</p>
</div>
<img src="assets/images/logo.png" class="logo">
