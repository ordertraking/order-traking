<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f8f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .tracking-container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #1a0a40; /* Dark purple from your image */
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: bold;
        }
        p {
            color: #555;
            margin-bottom: 30px;
            font-size: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            color: #333;
        }
        input[type="text"]::placeholder {
            color: #999;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #3b0099;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2d007a;
        }
        .divider {
            border-top: 1px solid #e0e0e0;
            margin: 30px auto;
            width: 50%;
        }
        .footer-link {
            margin-top: 30px;
            font-size: 13px;
        }
        .footer-link a {
            color: #8b8b99;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="tracking-container">
        <h2>Track your order</h2>
        <p>Enter your order details below to get the latest status.</p>

        <!-- Method 1: Order Number & Email/Phone -->
        <input type="text" id="orderNumber" placeholder="Order Number">
        <input type="text" id="contactInfo" placeholder="Email Address / Phone Number (with country code)">
        <button onclick="trackOrder()">Track Order</button>

        <div class="divider"></div>

        <!-- Method 2: Tracking Number -->
        <input type="text" id="trackingNumber" placeholder="Tracking Number">
        <button onclick="trackByNumber()">Track Order</button>

        <div class="footer-link">
            <a href="#">Order Tracking by Postship</a>
        </div>
    </div>

    <script>
        // Placeholder function for when the button is clicked
        function trackOrder() {
            alert("This will connect to your database to find the order!");
        }
        function trackByNumber() {
            alert("This will track using the tracking number!");
        }
    </script>
</body>
</html>
