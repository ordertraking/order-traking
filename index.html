<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Printings | Order Tracking</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f4c81,#1e88e5);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:#fff;
border-radius:20px;
padding:30px;
box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo h1{
font-size:32px;
color:#0f4c81;
font-weight:bold;
}

.logo p{
color:#777;
margin-top:5px;
font-size:15px;
}

input{
width:100%;
padding:15px;
font-size:16px;
border:2px solid #ddd;
border-radius:10px;
margin-top:20px;
outline:none;
}

input:focus{
border-color:#1e88e5;
}

button{
width:100%;
margin-top:15px;
padding:15px;
background:#1e88e5;
color:white;
font-size:17px;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1565c0;
}

#result{
margin-top:20px;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">

<h1>AMAZON PRINTINGS</h1>

<p>Professional Printing Services</p>

</div>

<input
type="text"
id="orderNo"
placeholder="Enter Order Number">

<button onclick="trackOrder()">

Track Order

</button>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
