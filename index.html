<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amazon Printing Private Limited | Order Tracking</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Logo -->
        <img src="logo.png" class="logo" alt="Amazon Printing Logo">

        <!-- Company Name -->
        <h1 class="company-name">AMAZON PRINTING</h1>

        <!-- Company Type -->
        <h2 class="company-type">PRIVATE LIMITED</h2>

        <!-- Page Title -->
        <p class="title">Order Tracking System</p>

        <!-- Search Box -->
        <input
            type="text"
            id="orderNo"
            placeholder="Enter Order Number">

        <!-- Button -->
        <button onclick="trackOrder()">
            Track Order
        </button>

        <!-- Result -->
        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
