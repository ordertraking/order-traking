<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Printings (Private) Limited | Order Tracking Service</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0b4f9c,#1e88e5);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:#fff;
border-radius:20px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo h1{
font-size:30px;
color:#0b4f9c;
font-weight:bold;
}

.logo h2{
font-size:18px;
color:#555;
margin-top:5px;
font-weight:normal;
}

.logo p{
margin-top:10px;
font-size:16px;
font-weight:bold;
color:#1e88e5;
letter-spacing:2px;
text-transform:uppercase;
}

input{
width:100%;
padding:15px;
border:2px solid #ddd;
border-radius:10px;
font-size:16px;
margin-bottom:15px;
outline:none;
}

input:focus{
border-color:#1e88e5;
}

button{
width:100%;
padding:15px;
background:#1e88e5;
color:#fff;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0b4f9c;
}

#result{
margin-top:20px;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">

<h1>Amazon Printings</h1>

<h2>(Private) Limited</h2>

<p>Order Tracking Service</p>

</div>

<input
type="text"
id="orderNo"
placeholder="Enter Your Order Number">

<button onclick="trackOrder()">
Track Order
</button>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
