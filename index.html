<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markaz Fabrics | Order Tracking</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0d47a1,#1976d2);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo h1{
color:#0d47a1;
font-size:30px;
}

.logo p{
color:#666;
font-size:14px;
margin-top:5px;
}

input{
width:100%;
padding:15px;
border:2px solid #ddd;
border-radius:10px;
font-size:16px;
margin-bottom:15px;
outline:none;
}

input:focus{
border-color:#1976d2;
}

button{
width:100%;
padding:15px;
background:#1976d2;
color:#fff;
font-size:17px;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0d47a1;
}

#result{
margin-top:20px;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">
<h1>MARKAZ FABRICS</h1>
<p>Premium Printing & Fabric Solutions</p>
</div>

<input
type="text"
id="orderNo"
placeholder="Enter Order Number">

<button onclick="trackOrder()">
Track Order
</button>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
