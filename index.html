<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amazon Printing Private Limited | Order Tracking</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Urdu Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="container">

        <!-- Logo -->
        <img src="logo.png" alt="Amazon Printing Logo" class="logo">

        <!-- Company Name -->
        <h1 class="company-name">
            AMAZON PRINTING
        </h1>

        <!-- Company Type -->
        <h2 class="company-type">
            PRIVATE LIMITED
        </h2>

        <!-- Page Title -->
        <p class="title">
            Order Tracking System
        </p>

        <!-- Order Number -->
        <input
            type="text"
            id="orderNo"
            placeholder="Enter Order Number">

        <!-- Button -->
        <button onclick="trackOrder()">
            📦 Track Order
        </button>

        <!-- Help Line -->
        <div class="help-line">

            <p class="help-title">
                Need Help?
            </p>

            <a href="tel:+923276650001">
                📞 +92 327 6650001
            </a>

        </div>

        <!-- Result -->
        <div id="result"></div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
